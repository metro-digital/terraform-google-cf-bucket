---
name: terraform-test

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  discover-terraform-versions:
    name: Discover Terraform test versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform-versions: ${{ steps.versions.outputs.terraform-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record pull request for the comment publisher
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -c 'import json, os; json.dump({"number": int(os.environ["PR_NUMBER"]),
          "head_sha": os.environ["PR_HEAD_SHA"]}, open("pr.json", "w"))'

      - name: Upload pull request metadata
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-pr
          path: pr.json
          overwrite: true
          retention-days: 14

      - name: Select latest stable patch per Terraform series
        id: versions
        # Provider mocking requires Terraform >= 1.7. Exclude prereleases.
        run: python3 .github/scripts/terraform-test-matrix.py >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests (Terraform ${{ matrix.terraform-version }}, Google ${{ matrix.google-provider-major }}.x${{ matrix.google-provider-version != 'latest' && ' minimum' || '' }})
    needs: discover-terraform-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform-version: ${{ fromJSON(needs.discover-terraform-versions.outputs.terraform-versions) }}
        google-provider-major: ['7', '8']
        # Distinguish the exact minimum from the latest 7.x job at the same
        # Terraform version, so include adds a job instead of replacing one.
        google-provider-version: ['latest']
        include:
          - terraform-version: ${{ fromJSON(needs.discover-terraform-versions.outputs.terraform-versions)[0] }}
            google-provider-major: '7'
            google-provider-version: '7.26.0'
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false

      - name: Check test formatting
        id: format
        run: terraform fmt -check -recursive

      - name: Select provider major
        env:
          GOOGLE_PROVIDER_MAJOR: ${{ matrix.google-provider-major }}
          GOOGLE_PROVIDER_VERSION: ${{ matrix.google-provider-version }}
        run: |
          # Restrict the provider for this job without changing the module's
          # published constraints. Terraform merges this override with versions.tf.
          provider_constraint="~> ${GOOGLE_PROVIDER_MAJOR}.0"
          if [ "$GOOGLE_PROVIDER_VERSION" != latest ]; then
            provider_constraint="= ${GOOGLE_PROVIDER_VERSION}"
          fi
          cat > ci-provider-versions_override.tf <<EOF
          terraform {
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "${provider_constraint}"
              }
            }
          }
          EOF

      - name: Initialize providers
        id: init
        run: terraform init -backend=false -input=false -upgrade

      - name: Validate module
        id: validate
        run: terraform validate -no-color

      - name: Run unit tests
        id: tests
        run: terraform test -no-color

      - name: Publish tested versions and results
        if: always()
        env:
          TERRAFORM_VERSION: ${{ matrix.terraform-version }}
          GOOGLE_PROVIDER_MAJOR: ${{ matrix.google-provider-major }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_RESULT_FILE: result.json
        run: node .github/scripts/terraform-test-summary.cjs

      - name: Upload matrix result for the PR comment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-result-${{ matrix.terraform-version }}-google${{ matrix.google-provider-major }}${{ matrix.google-provider-version != 'latest' && '-minimum' || '' }}
          path: result.json
          if-no-files-found: warn
          # Replace rerun jobs while preserving results of jobs not rerun.
          overwrite: true
          retention-days: 14

  runtime-minimum:
    name: Module minimum (Terraform 1.3.10, Google 7.26.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.3.10'
          terraform_wrapper: false

      - name: Select minimum provider
        run: |
          cat > ci-provider-versions_override.tf <<'EOF'
          terraform {
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "= 7.26.0"
              }
            }
          }
          EOF

      - name: Initialize and validate the module
        run: |
          terraform init -backend=false -input=false -upgrade
          terraform validate -no-color
